<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<meta name="color-scheme" content="light">
<meta name="theme-color" content="#110E0B">
<title>Title Sequence · Cut Paper</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Archivo:wdth,wght@62..125,400..900&family=Bodoni+Moda:ital,opsz,wght@0,6..96,400..900;1,6..96,400..900&family=Cormorant+Garamond:ital,wght@0,500;0,600;0,700;1,500;1,600&family=Courier+Prime:wght@400;700&family=League+Gothic:wdth@75..100&family=Six+Caps&display=swap">
<style>
/* =====================================================================
   TOKENS
   ===================================================================== */
:root{
  --paper:#EEE2C8;
  --paper-hi:#F4EAD4;
  --ink:#1B1713;
  --ink-2:#2A231C;
  --verm:#D65C3B;
  --verm-ink:#A63A22;
  --ochre:#DAA23D;
  --teal:#2A6B63;
  --teal-ink:#1D5049;
  --cobalt:#2F4B9A;
  --ultra:#2B3984;
  --cyan:#8DCBC7;
  --bd:#110E0B;

  --gothic:'League Gothic','Oswald','Arial Narrow',Impact,sans-serif;
  --sans:'Archivo','Helvetica Neue',Arial,sans-serif;
  --didone:'Bodoni Moda','Bodoni 72',Didot,Georgia,serif;
  --tall:'Six Caps','League Gothic','Arial Narrow',Impact,sans-serif;
  --map:'Cormorant Garamond',Garamond,'Times New Roman',serif;
  --type:'Courier Prime','Courier New',monospace;

  --cut:cubic-bezier(.16,.9,.2,1);
  --lift:drop-shadow(0 1.5px 0 rgba(30,14,4,.30)) drop-shadow(0 6px 6px rgba(30,14,4,.20));
  --lift-d:drop-shadow(0 1.5px 0 rgba(0,0,0,.55)) drop-shadow(0 7px 8px rgba(0,0,0,.45));
  --gone:120deg;
}

*{box-sizing:border-box;margin:0;padding:0}
html,body{height:100%}
body{background:var(--bd);color:var(--ink);font-family:var(--sans);-webkit-font-smoothing:antialiased;overflow:hidden;-webkit-text-size-adjust:100%}
button{font:inherit;color:inherit;background:none;border:0;cursor:pointer;text-align:inherit;-webkit-tap-highlight-color:transparent;letter-spacing:inherit}
:focus{outline:none}
:focus-visible{outline:2.5px solid var(--cobalt);outline-offset:3px}
.dark :focus-visible,.bk-movies :focus-visible,.bk-chess :focus-visible,.crp :focus-visible,.fin :focus-visible,.aside :focus-visible,.cue-menu :focus-visible{outline-color:var(--ochre)}
ol,ul{list-style:none}
[hidden]{display:none!important}
.vh{position:absolute!important;width:1px;height:1px;overflow:hidden;clip:rect(0 0 0 0);white-space:nowrap}

/* =====================================================================
   STAGE / BACKDROP (desktop) — the phone is one frame on a running strip
   ===================================================================== */
.stage{position:relative;height:100%;display:flex;align-items:center;justify-content:center;gap:64px}
.backdrop{position:fixed;inset:0;overflow:hidden;pointer-events:none;background:radial-gradient(120% 90% at 60% 40%,#1D1813 0,#110E0B 60%,#0A0806 100%)}
.bdp{position:absolute;display:block}
.bdp-disc{width:56vh;height:56vh;left:-14vh;bottom:-20vh;background:var(--verm);opacity:.9}
.bdp-bar{width:9vh;height:78vh;right:9vw;top:-6vh;background:var(--ochre);transform:rotate(7deg);opacity:.85}
.bdp-teal{width:30vw;height:16px;right:-2vw;bottom:15vh;background:var(--teal);transform:rotate(-4deg)}
.bdp-ink{width:46vh;height:46vh;right:-12vh;bottom:-14vh;background:#050403;opacity:.7}
.bd-grain{position:absolute;inset:0;background:var(--grain) 0 0/128px 128px;opacity:.45}

.reel{position:relative;height:100%;display:flex;align-items:center;padding:0 36px;background:#0A0806;box-shadow:0 0 0 1px rgba(255,240,210,.03),0 40px 120px rgba(0,0,0,.6)}
.reel::before,.reel::after{content:"";position:absolute;top:0;bottom:0;width:14px;background:var(--sprk) 0 0/14px 30px repeat-y;opacity:.16}
.reel::before{left:11px}.reel::after{right:11px}
.reel-ghost{position:absolute;left:36px;right:36px;height:40vh;background:var(--paper);opacity:.05}
.reel-ghost.up{bottom:calc(50% + min(422px,50vh - 28px) + 10px)}
.reel-ghost.dn{top:calc(50% + min(422px,50vh - 28px) + 10px)}
.reel-edge{position:absolute;top:50%;writing-mode:vertical-rl;font-family:var(--type);font-size:9px;letter-spacing:.32em;color:rgba(218,162,61,.55);transform:translateY(-50%);white-space:nowrap}
.reel-edge.l{left:-2px}.reel-edge.r{right:-2px;transform:translateY(-50%) rotate(180deg)}

.aside{position:relative;z-index:2;width:268px;flex:none;color:var(--paper)}
.as-k{font-size:10px;font-weight:800;letter-spacing:.3em;text-transform:uppercase;color:var(--ochre)}
.as-t{margin:14px 0 14px;font-family:var(--gothic);font-weight:400;font-size:92px;line-height:.82;letter-spacing:.01em;text-transform:uppercase}
.as-t span{color:var(--verm)}
.as-d{font-size:14px;line-height:1.5;color:rgba(244,234,212,.78);max-width:250px}
.as-ctl{margin-top:26px;display:grid;gap:8px}
.as-h{margin-top:22px;font-family:var(--type);font-size:10.5px;line-height:1.7;color:rgba(244,234,212,.42)}

.cbtn{display:flex;align-items:center;gap:12px;width:100%;height:44px;padding:0 16px;font-size:11px;font-weight:800;letter-spacing:.22em;text-transform:uppercase;color:var(--paper);background:#221C16;position:relative}
.cbtn::after{content:"";position:absolute;inset:0;border:1.5px solid rgba(244,234,212,.18);pointer-events:none}
.cbtn:hover{background:#2E261E}
.cbtn svg{width:14px;height:14px;flex:none}
.cbtn .cb-v{margin-left:auto;font-family:var(--type);font-weight:400;letter-spacing:.08em;color:var(--ochre)}
.cbtn[aria-pressed="true"] .cb-v{color:var(--cyan)}

/* =====================================================================
   SCREEN
   ===================================================================== */
.screen{position:relative;flex:none;width:390px;height:min(844px,calc(100vh - 56px));overflow:hidden;background:var(--paper);isolation:isolate;container-type:size}
.film{position:absolute;inset:-2px;will-change:transform}
.scroller{position:absolute;inset:2px;overflow-y:auto;overflow-x:hidden;overscroll-behavior:contain;scrollbar-width:none;-webkit-overflow-scrolling:touch;background:var(--paper)}
.scroller::-webkit-scrollbar{display:none}
.grain{position:absolute;inset:-64px;z-index:70;pointer-events:none;background:var(--grain) 0 0/128px 128px;opacity:.5}
.vig{position:absolute;inset:0;z-index:69;pointer-events:none;background:radial-gradient(130% 95% at 50% 45%,transparent 58%,rgba(35,18,4,.16) 100%)}

@media (max-width:899px){.aside{display:none}.stage{gap:0}}
@media (max-width:599px){
  .stage{display:block}
  .backdrop,.reel::before,.reel::after,.reel-ghost,.reel-edge{display:none}
  .reel{display:block;padding:0;background:none;box-shadow:none}
  .screen{width:390px;height:100vh;height:100dvh}
}
@media (max-width:479px){.screen{width:100vw}}

/* paper fibre (plain alpha, no blend modes) */
.fib::after,.fib-l::after{content:"";position:absolute;inset:0;pointer-events:none;z-index:3;background:var(--fib-d) 0 0/240px 240px}
.fib-l::after{background-image:var(--fib-l)}

/* =====================================================================
   STOP-MOTION BOIL — 3 hand-cut variants stepped at 12 fps
   ===================================================================== */
.boil{clip-path:var(--c0)}
.bf1,.bf2{opacity:0}
@keyframes boilc{0%{clip-path:var(--c0)}33.333%{clip-path:var(--c1)}66.666%{clip-path:var(--c2)}}
@keyframes bf{0%{opacity:1}33.333%,100%{opacity:0}}
@keyframes weave{0%{transform:translate(0,0)}12%{transform:translate(.5px,-.4px) rotate(.015deg)}25%{transform:translate(-.3px,.5px)}37%{transform:translate(.2px,.2px) rotate(-.012deg)}50%{transform:translate(-.5px,-.2px)}62%{transform:translate(.4px,.5px) rotate(.01deg)}75%{transform:translate(-.2px,-.5px)}87%{transform:translate(.3px,-.1px) rotate(-.015deg)}}
@keyframes grain{0%{transform:translate(0,0)}14%{transform:translate(-31px,17px)}28%{transform:translate(23px,-41px)}42%{transform:translate(-47px,-9px)}57%{transform:translate(11px,37px)}71%{transform:translate(-13px,-29px)}85%{transform:translate(39px,7px)}}
@keyframes spin{to{transform:rotate(360deg)}}
@keyframes blink{50%{opacity:.25}}
@media (prefers-reduced-motion:no-preference){
  .boil{animation:boilc .25s steps(1,end) infinite}
  .bf{animation:bf .25s steps(1,end) infinite}
  .bf1{animation-delay:-.1667s}
  .bf2{animation-delay:-.0833s}
  .film{animation:weave 1.33s steps(1,end) infinite}
  .grain,.bd-grain{animation:grain .58s steps(1,end) infinite}
  .off .boil,.off .bf,.off .spin{animation-play-state:paused}
}

/* =====================================================================
   SECTIONS — stacked layers of cut paper; each bottom edge lifts
   ===================================================================== */
.sec{position:relative;z-index:var(--z);margin-bottom:-30px}
.pp{position:relative;overflow:hidden}
.pp>*{position:relative;z-index:1}
.sh{position:absolute;inset:0;pointer-events:none;z-index:-1}
.sh1{transform:translateY(2.5px);background:rgba(28,12,2,.34)}
.sh2{transform:translateY(8px);background:rgba(28,12,2,.11)}
.kick{display:flex;align-items:center;gap:10px;font-size:10px;font-weight:800;letter-spacing:.28em;text-transform:uppercase}
.kick i{flex:1;height:2px;background:currentColor;opacity:.75}
.b-meta{display:flex;align-items:center;justify-content:space-between;gap:12px;margin-top:18px;font-size:10.5px;font-weight:800;letter-spacing:.2em;text-transform:uppercase}
.b-meta p{line-height:1.5}
.enter-w{flex:none;filter:var(--lift)}
.enter{display:inline-flex;align-items:center;gap:10px;height:42px;padding:0 18px 0 20px;background:var(--ink);color:var(--paper);font-size:11px;font-weight:800;letter-spacing:.26em;text-transform:uppercase}
.enter svg{width:18px;height:10px}

/* ---------- HERO ---------- */
.hero .pp{background:var(--paper);padding:calc(12px + env(safe-area-inset-top)) 18px 56px}
.hero-shape-w{position:absolute!important;inset:0;z-index:0!important;pointer-events:none}
.flip .hero-shape-w{transform:scaleX(-1)}
.hero-shape{position:absolute;background:var(--shape,var(--ochre))}
.hs-disc{width:330px;height:330px;right:-150px;top:190px}
.hs-bar{width:96px;height:560px;right:36px;top:-30px;transform:rotate(5deg)}
.hs-tri{width:330px;height:420px;right:-40px;top:150px}
.topbar{display:flex;align-items:center;height:36px;padding-right:46px}
.me{display:flex;align-items:center;gap:10px;font-size:10px;font-weight:700;letter-spacing:.22em;text-transform:uppercase}
.me b{font-size:13px;font-weight:900;letter-spacing:.2em}
.stk{display:flex;align-items:flex-end;gap:2.5px;height:14px}
.stk i{display:block;width:4px;background:var(--verm-ink)}
.month{display:block;margin-top:16px;font-family:var(--gothic);font-size:120px;line-height:.8;white-space:nowrap;letter-spacing:.004em;color:var(--ink);text-shadow:1.6px 1.1px 0 rgba(47,75,154,.26)}
.ml{display:inline-block}
.od{display:inline-block;position:relative;width:.735em;height:.735em;margin:0 .035em;vertical-align:baseline;filter:var(--lift)}
.od-f{position:absolute;inset:0;background:var(--dial,var(--cobalt))}
.od-w{position:absolute;inset:0;clip-path:var(--c0);background:conic-gradient(var(--paper) 0 var(--gone),transparent 0)}
.od-w::after{content:"";position:absolute;inset:0;background:var(--fib-d) 0 0/240px 240px}
.od-h{position:absolute;left:50%;top:6%;width:3.6%;height:44%;margin-left:-1.8%;background:var(--ink);transform-origin:50% 100%;transform:rotate(var(--gone))}
.od-c{position:absolute;left:44.5%;top:44.5%;width:11%;height:11%;border-radius:50%;background:var(--ink)}
.od-t{position:absolute;inset:0}
.od-t i{position:absolute;left:49%;top:1.5%;width:2%;height:7%;background:var(--paper);opacity:.75;transform-origin:50% 692%}

.date-row{display:flex;align-items:flex-end;gap:16px;margin-top:10px}
.flip .date-row{flex-direction:row-reverse}
.num{flex:none;font-family:var(--gothic);font-size:304px;line-height:.75;color:var(--num,var(--verm));letter-spacing:-.01em;text-shadow:3px 2px 0 rgba(27,23,19,.15);margin-bottom:-3px;--cdf:66px}
.num.two{font-size:226px}
.side{flex:1;min-width:0;padding:2px 0 4px;align-self:stretch;display:flex;flex-direction:column}
.dow{display:block;font-weight:800;font-size:12px;letter-spacing:.36em;color:var(--verm-ink);padding-bottom:9px;border-bottom:2.5px solid var(--ink);white-space:nowrap}
.cd-k{display:block;margin-top:auto;padding-top:14px;font-size:9.5px;font-weight:800;letter-spacing:.26em;text-transform:uppercase}
.cd{display:flex;margin-top:6px;font-family:var(--gothic);font-size:var(--cdf,66px);line-height:.86;color:var(--ink)}
.two-day .cd{--cdf:45px}
.dg{display:inline-block;width:.42em;text-align:center;overflow:hidden}
.dg i{display:inline-block;font-style:normal}
.cl{display:inline-block;width:.2em;text-align:center;opacity:.55}
.cd-m{display:block;margin-top:8px;font-size:9.5px;font-weight:800;letter-spacing:.24em;text-transform:uppercase;color:var(--verm-ink)}

.band-w{margin:22px -44px 0;transform:rotate(var(--band));filter:var(--lift)}
.band{display:flex;align-items:center;gap:12px;height:60px;padding:0 60px;background:var(--ink);color:var(--paper)}
.bk{font-size:9.5px;font-weight:800;letter-spacing:.3em;text-transform:uppercase}
.bv{font-family:var(--gothic);font-weight:400;font-size:32px;line-height:1;letter-spacing:.02em}
.bv i{font-style:normal;opacity:.5}
.sq{display:flex;gap:3px}
.sq i{display:block;width:8px;height:17px;background:rgba(238,226,200,.18)}
.sq .on{background:var(--c)}
.sq .half{background:linear-gradient(to top,var(--c) 50%,rgba(238,226,200,.18) 50%)}
.rk{margin-left:auto;display:flex;align-items:baseline;gap:6px;font-size:9.5px;font-weight:800;letter-spacing:.24em;text-transform:uppercase;white-space:nowrap}
.rk b{font-family:var(--gothic);font-weight:400;font-size:32px;letter-spacing:.02em;color:var(--ochre);line-height:1}

.pres{display:flex;align-items:center;gap:11px;margin-top:22px;min-height:26px;overflow:hidden}
.pd{flex:none;width:9px;height:9px;background:var(--verm)}
.pt{display:block;font-size:14px;font-stretch:90%;white-space:nowrap}
.pt b{font-weight:800}
.pl{font-weight:700;border-bottom:1.5px solid currentColor;padding:2px 0}
@media (prefers-reduced-motion:no-preference){.pd{animation:blink 1.6s steps(2,end) infinite}}

/* ---------- WORDS ---------- */
.bk-words .pp{background:var(--verm);color:var(--ink);padding:60px 18px 66px}
.wst{position:absolute!important;z-index:0!important;background:var(--ink);height:var(--h)}
.cutword{margin:18px -6px 0}
.cutword svg{display:block;width:100%;height:auto;overflow:visible;filter:var(--lift)}
.cutw .lf{fill:var(--lf,var(--paper));fill-rule:evenodd}
.cutw .lb{fill:var(--lb,var(--ink));fill-rule:evenodd;opacity:.92}

/* ---------- credit rows (shared) ---------- */
.crl{margin-top:24px;border-top:2px solid currentColor}
.cr{display:flex;align-items:center;gap:14px;width:100%;min-height:66px;padding:11px 0;border-bottom:1.5px solid var(--rule,rgba(27,23,19,.42))}
.cr-g{flex:none;width:46px;height:42px;display:grid;place-items:center}
.cr-m{flex:1;min-width:0;display:block}
.cr-l{display:flex;align-items:baseline;gap:8px}
.cr-n{font-weight:800;font-stretch:70%;font-size:19px;letter-spacing:.05em;text-transform:uppercase;white-space:nowrap;line-height:1.1}
.cr-d{flex:1;min-width:14px;height:3px;align-self:flex-end;margin-bottom:6px;background:radial-gradient(circle,currentColor 1.1px,transparent 1.5px) 0 50%/7px 3px repeat-x;opacity:.75}
.cr-v{font-family:var(--gothic);font-size:26px;line-height:.9;letter-spacing:.03em;white-space:nowrap;text-transform:uppercase}
.cr-s{display:block;margin-top:4px;font-size:11px;font-weight:600;letter-spacing:.05em;opacity:.88}
.cr-s u{text-decoration:none;border-bottom:1.5px solid currentColor;font-weight:800}
.st-new .cr-v{font-family:var(--sans);font-size:10px;font-weight:800;letter-spacing:.24em;padding:6px 9px 6px 10px;background:var(--ink);color:var(--paper);align-self:center}
.st-progress .cr-v{font-family:var(--sans);font-size:10px;font-weight:800;letter-spacing:.24em;padding:5px 8px 5px 9px;border:1.5px solid currentColor;align-self:center}
.cr.flash{animation:flash 1.1s steps(2,end) 2}
@keyframes flash{50%{background:rgba(27,23,19,.14)}}

/* glyphs */
.mg{display:grid;grid-template-columns:repeat(5,7px);gap:1.6px}
.mg i{display:block;width:7px;height:7px}
.t-c{background:var(--ink)}.t-p{background:var(--ochre)}.t-a{background:rgba(27,23,19,.2)}
.pal{display:flex;gap:2px;filter:drop-shadow(0 1px 0 rgba(0,0,0,.4))}
.pal i{display:block;width:7px;height:32px}
.dots{display:flex;gap:3px}
.dots i{display:block;width:7.5px;height:7.5px;border-radius:50%;border:1.5px solid currentColor}
.dots .on{background:currentColor}
.gh{width:40px;height:40px;opacity:.62;overflow:visible}
.gh *{vector-effect:non-scaling-stroke}

/* ---------- MOVIES ---------- */
.bk-movies .pp{background:var(--ink);color:var(--paper);padding:60px 42px 70px;--rule:rgba(238,226,200,.24)}
.sprk{position:absolute!important;top:0;bottom:0;width:12px;background:var(--sprk) 0 0/12px 26px repeat-y;opacity:.9}
.sprk.l{left:13px}.sprk.r{right:13px}
.edge{position:absolute!important;top:120px;writing-mode:vertical-rl;font-family:var(--type);font-size:8.5px;letter-spacing:.34em;color:var(--ochre);opacity:.6;white-space:nowrap}
.edge.l{left:29px}.edge.r{right:29px;transform:rotate(180deg)}
.mv-art{position:absolute!important;inset:0;z-index:0!important;pointer-events:none}
.iris-l .mv-art{transform:scaleX(-1)}
.mv-barrel{position:absolute;right:-70px;top:-6px;width:240px;height:240px;filter:drop-shadow(0 8px 14px rgba(0,0,0,.6))}
.mv-barrel svg{width:100%;height:100%;display:block}
.mv-beam{position:absolute;right:50px;top:114px;width:420px;height:460px;transform-origin:100% 0;transform:rotate(16deg);clip-path:polygon(100% 0,0 52%,0 100%);background:linear-gradient(225deg,rgba(141,203,199,.46),rgba(141,203,199,.12) 45%,rgba(141,203,199,0) 85%);mix-blend-mode:screen}
.mv-title{margin-top:16px;font-family:var(--tall);font-size:214px;line-height:.78;color:var(--ochre);letter-spacing:.03em;text-shadow:4px 0 0 rgba(141,203,199,.32),-1px 0 0 rgba(214,92,59,.3);white-space:nowrap}
.bk-movies .enter{background:var(--ochre);color:var(--ink)}
.bk-movies .enter-w{filter:var(--lift-d)}
.bk-movies .cr-n{font-family:var(--tall);font-weight:400;font-stretch:100%;font-size:36px;letter-spacing:.07em;line-height:.9}
.bk-movies .cr-v{font-family:var(--tall);font-size:36px;color:var(--ochre);letter-spacing:.06em}
.bk-movies .cr-d{color:var(--ochre)}
.bk-movies .st-new .cr-v,.bk-movies .st-progress .cr-v{font-family:var(--sans);font-size:10px;background:var(--ochre);color:var(--ink);border:0}
.bk-movies .gh{color:var(--paper)}

/* ---------- GEOGRAPHY ---------- */
.bk-geo .pp{background:var(--paper);color:var(--teal-ink);padding:60px 18px 70px}
.geo-grid{position:absolute!important;z-index:0!important;left:0;top:0;width:100%;height:330px;pointer-events:none}
.geo-title-w{margin-top:78px;height:62px}
.geo-title{display:block;font-family:var(--map);font-weight:600;font-size:46px;letter-spacing:.2em;line-height:1;white-space:nowrap;transform:rotate(var(--ga));transform-origin:0 100%;color:var(--teal-ink);text-shadow:1.5px 1px 0 rgba(214,92,59,.25)}
.geo-co{margin-top:6px;font-family:var(--type);font-size:12px;letter-spacing:.1em;color:var(--teal-ink)}
.bk-geo .enter{background:var(--teal);color:var(--paper)}
.geo-slab-w{margin:26px -10px 0;filter:var(--lift)}
.geo-slab{position:relative;background:var(--teal);color:var(--paper);padding:10px 22px 14px;--rule:rgba(238,226,200,.3)}
.geo-slab .grat{position:absolute;inset:0;width:100%;height:100%;pointer-events:none}
.geo-slab .crl{position:relative;margin-top:0;border-top:0}
.geo-slab .cr:last-child{border-bottom:0}
.bk-geo .cr-n{font-family:var(--map);font-weight:700;font-stretch:100%;font-size:20px;letter-spacing:.16em}
.bk-geo .cr-v{font-family:var(--map);font-weight:600;font-size:24px;letter-spacing:.06em}
.bk-geo .st-new .cr-v,.bk-geo .st-progress .cr-v{font-family:var(--sans);font-size:10px;background:var(--paper);color:var(--teal-ink)}
.bk-geo .gh{color:var(--paper)}

/* ---------- CHESS ---------- */
.bk-chess .pp{background:var(--ultra);color:var(--paper);padding:60px 18px 76px;min-height:320px}
.spiral-w{position:absolute!important;right:-110px;top:14px;width:360px;height:360px;z-index:0!important}
.spiral{width:100%;height:100%;display:block}
@media (prefers-reduced-motion:no-preference){.spin{animation:spin 26s linear infinite}.spin.rev{animation-direction:reverse}}
.ch-title{margin-top:26px;font-family:var(--gothic);font-size:100px;letter-spacing:.3em;line-height:.82;text-shadow:3px 2px 0 rgba(214,92,59,.35)}
.soon-w{display:inline-block;margin-top:22px;filter:var(--lift-d)}
.soon{display:inline-block;background:var(--paper);color:var(--ultra);padding:10px 16px;font-weight:800;letter-spacing:.3em;font-size:11px;text-transform:uppercase}
.ch-s{margin-top:16px;font-family:var(--map);font-style:italic;font-size:18px;line-height:1.3;max-width:200px;opacity:.92}

/* ---------- BILLING BLOCK ---------- */
.billing .pp{background:var(--paper-hi);padding:58px 18px calc(96px + env(safe-area-inset-bottom));text-align:center}
.bl-top{display:flex;align-items:center;justify-content:space-between;gap:10px}
.bl-top h2{font-size:10px;font-weight:800;letter-spacing:.28em;text-transform:uppercase}
.tog-w{filter:var(--lift)}
.tog{display:flex;background:var(--ink);padding:3px}
.tog button{height:32px;padding:0 12px;font-size:9.5px;font-weight:800;letter-spacing:.22em;text-transform:uppercase;color:var(--paper)}
.tog button[aria-pressed="true"]{background:var(--paper);color:var(--ink)}
.bl{margin-top:30px;font-family:var(--gothic);text-transform:uppercase;color:var(--ink);font-variation-settings:'wdth' 75}
.bl em{font-family:var(--didone);font-style:italic;font-weight:500;text-transform:none;font-size:.42em;letter-spacing:0;vertical-align:.32em;margin:0 .22em;font-variation-settings:normal}
.bl-star{font-family:var(--sans);font-size:10px;font-weight:800;letter-spacing:.5em;padding-left:.5em}
.bl-a{display:flex;justify-content:center;gap:14px;margin-top:10px}
.bn{display:flex;flex-direction:column;align-items:center}
.bn b{font-weight:400;font-size:62px;line-height:.84;letter-spacing:.015em}
.bn i{font-style:normal;font-family:var(--sans);font-size:10px;font-weight:800;letter-spacing:.2em;margin-top:6px;font-variation-settings:normal}
.bn.me b{color:var(--verm-ink)}
.bn.me i::before{content:"YOU · "}
.bl-b{margin-top:16px;font-size:34px;line-height:1;letter-spacing:.02em}
.bl-b span{white-space:nowrap}
.bl-b small{font-family:var(--sans);font-size:9px;font-weight:800;letter-spacing:.14em;vertical-align:.95em;margin-left:3px;font-variation-settings:normal}
.bl-b .me{color:var(--verm-ink)}
.bl-r{height:2px;background:var(--ink);margin:24px 0 18px}
.bl-c{display:flex;justify-content:space-between;gap:6px}
.bl-c span{display:flex;flex-direction:column;align-items:center;flex:1}
.bl-c small{font-family:var(--sans);font-size:8.5px;font-weight:800;letter-spacing:.2em;margin-bottom:5px;font-variation-settings:normal}
.bl-c b{font-weight:400;font-size:30px;line-height:.9;letter-spacing:.03em}
.bl-c .c-words b{color:var(--verm-ink)}.bl-c .c-movies b{color:#8F6516}.bl-c .c-geography b{color:var(--teal)}
.bl-d{margin-top:22px;font-family:var(--sans);font-size:9.5px;font-weight:700;letter-spacing:.26em;line-height:1.9;font-variation-settings:normal}
.bl-note{margin-top:12px;font-family:var(--didone);font-style:italic;font-size:15px;text-transform:none;font-variation-settings:normal}
.bl-mark{margin:30px auto 0;width:64px;height:64px;filter:var(--lift)}
.bl-end{margin-top:14px;font-size:9.5px;font-weight:800;letter-spacing:.32em;text-transform:uppercase;opacity:.75}

/* ---------- scroll choreography (scrubbed like a title sequence) ---------- */
@keyframes scUp{from{transform:translateY(64px)}}
@keyframes scL{from{transform:translateX(-108%) rotate(-3deg)}}
@keyframes scR{from{transform:translateX(108%) rotate(3deg)}}
@keyframes scRot{from{transform:rotate(-8deg) translateY(56px)}}
@keyframes parRot{from{transform:rotate(-55deg)}to{transform:rotate(55deg)}}
@keyframes parX{from{transform:translateX(-34px)}to{transform:translateX(34px)}}
@keyframes parY{from{transform:translateY(-40px)}to{transform:translateY(40px)}}
@supports (animation-timeline:view()){
  @media (prefers-reduced-motion:no-preference){
    .sc{animation:scUp linear both;animation-timeline:view();animation-range:entry 0% entry 90%}
    .sc.l{animation-name:scL;animation-timing-function:steps(6,end)}
    .sc.r{animation-name:scR;animation-timing-function:steps(6,end)}
    .sc.rot{animation-name:scRot}
    .sc.st{animation-timing-function:steps(5,end)}
    .par-rot{animation:parRot linear both;animation-timeline:view();animation-range:cover}
    .par-x{animation:parX linear both;animation-timeline:view();animation-range:cover}
    .par-y{animation:parY linear both;animation-timeline:view();animation-range:cover}
  }
}

/* =====================================================================
   RUNNING ORDER TAB + SHEET
   ===================================================================== */
.ro-w{position:absolute;left:50%;bottom:calc(14px + env(safe-area-inset-bottom));z-index:20;transform:translateX(-50%);filter:var(--lift-d)}
.ro-tab{display:flex;align-items:center;gap:14px;height:48px;padding:0 22px 0 24px;background:var(--ink);color:var(--paper);font-size:10.5px;font-weight:800;letter-spacing:.28em;text-transform:uppercase;white-space:nowrap}
.ro-tab .ro-n{font-family:var(--gothic);font-weight:400;font-size:24px;letter-spacing:.04em;color:var(--ochre)}
.ro-tab .ro-ic{display:grid;gap:3px}
.ro-tab .ro-ic i{display:block;width:16px;height:2px;background:currentColor}
.ro-tab .ro-ic i:nth-child(2){width:11px}

.sheet{position:absolute;inset:0;z-index:30}
.scrim{position:absolute;inset:0;background:rgba(17,14,11,.55)}
.sh-paper-w{position:absolute;left:0;right:0;bottom:0;max-height:88%;display:flex;filter:drop-shadow(0 -6px 12px rgba(0,0,0,.35))}
.sh-paper{position:relative;width:100%;overflow:auto;background:var(--paper-hi);color:var(--ink);padding:34px 20px calc(26px + env(safe-area-inset-bottom));font-family:var(--type)}
.sh-head{display:flex;align-items:flex-start;justify-content:space-between;gap:12px}
.sh-t{font-family:var(--gothic);font-weight:400;font-size:52px;line-height:.86;letter-spacing:.02em;text-transform:uppercase}
.sh-x{font-family:var(--sans);font-size:10px;font-weight:800;letter-spacing:.24em;text-transform:uppercase;padding:10px 12px;background:var(--ink);color:var(--paper)}
.sh-meta{margin-top:10px;font-size:11.5px;line-height:1.6;letter-spacing:.02em}
.sh-tbl{margin-top:16px;border-top:1.5px solid var(--ink)}
.sh-unit{padding:12px 0 4px;font-size:11px;font-weight:700;letter-spacing:.14em;text-transform:uppercase;color:var(--verm-ink)}
.sh-row{display:grid;grid-template-columns:30px 1fr auto;align-items:center;gap:8px;width:100%;min-height:44px;padding:6px 0;border-bottom:1px dashed rgba(27,23,19,.35);font-size:14px;letter-spacing:.02em;text-transform:uppercase}
.sh-row .n{opacity:.6;font-size:12px}
.sh-row .s{font-size:11px;letter-spacing:.08em}
.stamp{display:inline-block;padding:3px 7px 2px;border:2px solid var(--verm-ink);color:var(--verm-ink);font-weight:700;transform:rotate(-4deg);opacity:.9}
.sh-row .go{border-bottom:1.5px solid currentColor}
.sh-row[disabled]{opacity:.55;cursor:default}
.sh-foot{margin-top:16px;font-size:11.5px;line-height:1.6}

/* =====================================================================
   CREDITS ROLL PANEL
   ===================================================================== */
.crp{position:absolute;inset:0;z-index:32;background:var(--ink);color:var(--paper);overflow:hidden}
.crp-sc{position:absolute;inset:0;overflow:auto;padding:calc(70px + env(safe-area-inset-top)) 20px 60px}
.crp-x{position:absolute;top:calc(14px + env(safe-area-inset-top));left:16px;z-index:2;display:flex;align-items:center;gap:8px;height:40px;padding:0 14px;font-size:10px;font-weight:800;letter-spacing:.26em;text-transform:uppercase;border:1.5px solid rgba(238,226,200,.35)}
.roll{text-align:center}
.crp-k{font-size:10px;font-weight:800;letter-spacing:.32em;text-transform:uppercase;color:var(--ochre)}
.crp-t{margin-top:16px;font-weight:400;line-height:.9;text-transform:uppercase}
.crp-t.words{font-family:var(--didone);font-weight:800;font-size:54px;letter-spacing:-.01em;line-height:.95;color:var(--verm)}
.crp-t.movies{font-family:var(--tall);font-size:104px;letter-spacing:.05em;color:var(--ochre)}
.crp-t.geography{font-family:var(--map);font-weight:600;font-size:44px;letter-spacing:.2em;color:#8CC3B9}
.crp-s{margin-top:16px;font-family:var(--didone);font-style:italic;font-size:16px;opacity:.85}
.cast{margin-top:30px}
.cast li{display:grid;grid-template-columns:1fr 58px 1fr;align-items:center;gap:14px;padding:12px 0}
.c-n{justify-self:end;font-family:var(--gothic);font-size:34px;line-height:.9;letter-spacing:.06em;text-transform:uppercase}
.c-v{justify-self:start;text-align:left;font-size:11px;font-weight:800;letter-spacing:.18em;text-transform:uppercase;line-height:1.5}
.c-v small{display:block;font-weight:600;letter-spacing:.1em;opacity:.65}
.c-g{display:grid;place-items:center;color:var(--paper)}
.cast .me .c-n{color:var(--verm)}
.cast .wait{opacity:.5}
.crp .t-c{background:var(--verm)}.crp .t-p{background:var(--ochre)}.crp .t-a{background:rgba(238,226,200,.18)}
.crp-f{margin:34px auto 0;max-width:260px;font-size:11px;line-height:1.7;letter-spacing:.14em;text-transform:uppercase;opacity:.7}
.crp-rule{width:60px;height:2px;background:var(--verm);margin:26px auto 0}

/* =====================================================================
   WORLDS (entered buckets)
   ===================================================================== */
.world{position:absolute;inset:0;z-index:28;overflow:hidden}
.w-ground{position:absolute;inset:0}
.w-body{position:absolute;inset:0;overflow-y:auto;overflow-x:hidden;padding:calc(16px + env(safe-area-inset-top)) 18px calc(48px + env(safe-area-inset-bottom));scrollbar-width:none}
.w-body::-webkit-scrollbar{display:none}
.w-top{position:relative;z-index:2;display:flex;align-items:center;justify-content:space-between;height:44px}
.back-w{filter:var(--lift)}
.back{display:inline-flex;align-items:center;gap:10px;height:40px;padding:0 16px 0 14px;font-size:10.5px;font-weight:800;letter-spacing:.26em;text-transform:uppercase;background:var(--ink);color:var(--paper)}
.back svg{width:16px;height:10px}
.w-reel{font-size:10px;font-weight:800;letter-spacing:.3em;text-transform:uppercase}
.w-head{position:relative;z-index:2;margin-top:26px}
.w-sub{margin-top:18px;font-size:11px;font-weight:800;letter-spacing:.2em;text-transform:uppercase;line-height:1.7}
.w-list{position:relative;z-index:2;margin-top:24px;display:grid;gap:14px}
.wr-w{filter:var(--lift)}
.wr{display:grid;grid-template-columns:44px 1fr 52px;align-items:center;gap:12px;width:100%;min-height:92px;padding:14px 16px;background:var(--paper);color:var(--ink)}
.wr-no{font-family:var(--gothic);font-size:40px;line-height:.8;opacity:.9}
.wr-n{display:block;font-weight:800;font-stretch:72%;font-size:24px;letter-spacing:.04em;text-transform:uppercase;line-height:1}
.wr-s{display:block;margin-top:6px;font-size:11px;font-weight:700;letter-spacing:.14em;text-transform:uppercase;opacity:.8}
.wr-g{display:grid;place-items:center}
.w-board{position:relative;z-index:2;margin-top:30px;padding-top:14px;border-top:2px solid currentColor}
.w-board h3{font-size:10px;font-weight:800;letter-spacing:.28em;text-transform:uppercase}
.w-board ol{margin-top:10px;display:grid;gap:2px}
.w-board li{display:flex;align-items:baseline;gap:8px;font-family:var(--gothic);font-size:26px;letter-spacing:.05em;text-transform:uppercase}
.w-board li .cr-d{margin-bottom:5px}
.w-board li.me{color:var(--paper)}
.w-fx{position:absolute;inset:0;z-index:5;pointer-events:none;overflow:hidden}

.w-words .w-ground{background:var(--verm)}
.tiles{display:flex;gap:8px;justify-content:flex-start}
.tile-w{filter:var(--lift)}
.tile{display:grid;place-items:center;width:58px;height:66px;background:var(--paper);color:var(--ink)}
.tile svg{width:62%;height:auto;overflow:visible}
.tile .lf{fill:var(--ink);fill-rule:evenodd}
.w-words .w-board li.me{color:var(--paper)}

.w-movies .w-ground{background:var(--ink)}
.w-movies{color:var(--paper)}
.w-movies .w-body{padding-left:42px;padding-right:42px}
.w-movies .back{background:var(--ochre);color:var(--ink)}
.w-movies .back-w{filter:none}
.w-movies .mvw-t{font-family:var(--tall);font-size:150px;line-height:.8;color:var(--ochre);letter-spacing:.04em;text-shadow:4px 0 0 rgba(141,203,199,.3)}
.w-movies .wr-w{filter:none}
.w-movies .wr{background:#0E0C0A;color:var(--paper);border:1.5px solid rgba(238,226,200,.32);border-radius:10px}
.w-movies .wr-n{font-family:var(--tall);font-weight:400;font-stretch:100%;font-size:38px;letter-spacing:.04em;line-height:.85;white-space:nowrap}
.w-movies .wr-no{color:var(--ochre)}
.w-movies .gh{color:var(--paper)}
.w-movies .w-board li.me{color:var(--ochre)}
.cur{position:absolute;inset:0;background:var(--ink);display:grid;place-items:center;overflow:hidden}
.cur span{font-family:var(--tall);font-size:min(60cqh,520px);line-height:.8;color:var(--ochre);letter-spacing:.04em;white-space:nowrap}
.cur.l{filter:drop-shadow(6px 0 8px rgba(0,0,0,.6))}
.cur.r{filter:drop-shadow(-6px 0 8px rgba(0,0,0,.6))}

.w-geography .w-ground{background:var(--teal)}
.w-geography{color:var(--paper)}
.w-geography .grat-w{position:absolute;inset:0;width:100%;height:100%}
.w-geography .geow-t{font-family:var(--map);font-weight:600;font-size:42px;letter-spacing:.2em;line-height:1;white-space:nowrap}
.w-geography .geow-c{margin-top:8px;font-family:var(--type);font-size:12px;letter-spacing:.1em;opacity:.85}
.w-geography .back{background:var(--paper);color:var(--teal-ink)}
.w-geography .wr{color:var(--teal-ink)}
.w-geography .wr-n{font-family:var(--map);font-weight:700;font-stretch:100%;font-size:24px;letter-spacing:.14em}
.w-geography .wr-no{font-family:var(--type);font-size:13px;letter-spacing:.06em}
.w-geography .w-board li.me{color:var(--ochre)}
.gx-title{position:absolute;left:0;right:0;top:46%;text-align:center;font-family:var(--map);font-weight:600;font-size:40px;letter-spacing:.2em;color:var(--paper);white-space:nowrap}

/* =====================================================================
   INTRO — the opening title sequence (one seekable timeline)
   ===================================================================== */
.intro{position:absolute;inset:0;z-index:40;overflow:hidden;background:var(--ink);cursor:pointer}
.intro.go{background:transparent}
.shot{position:absolute;inset:0;overflow:hidden;opacity:0}
.i-skip{position:absolute;right:16px;bottom:calc(18px + env(safe-area-inset-bottom));z-index:9;height:36px;padding:0 14px;font-size:9.5px;font-weight:800;letter-spacing:.3em;text-transform:uppercase;color:var(--paper);background:rgba(17,14,11,.55);border:1px solid rgba(238,226,200,.3)}
.s1{background:var(--ink)}
.i1-strip-w{position:absolute;left:-12%;width:124%;top:38%;filter:var(--lift-d)}
.i1-strip{height:112px;background:var(--paper);display:flex;align-items:center;justify-content:center}
.i1-strip span{font-family:var(--gothic);font-size:88px;line-height:1;letter-spacing:.16em;padding-left:.16em;color:var(--ink)}
.i1-dot{position:absolute;width:74px;height:74px;right:15%;top:19%;background:var(--verm)}
.i1-cap{position:absolute;left:24px;bottom:20%;font-size:10px;font-weight:800;letter-spacing:.32em;text-transform:uppercase;color:var(--paper);line-height:1.9}
.i1-cap b{color:var(--ochre);font-weight:800}
.s2{background:var(--paper)}
.i2-wrap{position:absolute;left:18px;right:18px;top:17%}
.i2-month{font-family:var(--gothic);white-space:nowrap;line-height:.8;color:var(--ink)}
.i2-row{display:flex;align-items:flex-end;gap:14px;margin-top:12px}
.i2-num{font-family:var(--gothic);font-size:min(46cqh,400px);line-height:.75;color:var(--num,var(--verm))}
.i2-dow{writing-mode:vertical-rl;transform:rotate(180deg);font-size:13px;font-weight:800;letter-spacing:.5em;color:var(--verm-ink);padding-bottom:6px}
.s3{background:var(--paper)}
.i3-dial{position:absolute;left:50%;top:44%;width:min(72cqw,290px);height:min(72cqw,290px);transform-origin:50% 50%;margin:calc(min(72cqw,290px) / -2) 0 0 calc(min(72cqw,290px) / -2);font-size:min(72cqw,290px)}
.i3-dial .od{width:100%;height:100%;margin:0;position:absolute;inset:0}
.i3-k{position:absolute;left:0;right:0;top:calc(44% - min(72cqw,290px) / 2 - 52px);text-align:center;font-weight:800;font-size:11px;letter-spacing:.42em;padding-left:.42em;text-transform:uppercase}
.i3-t{position:absolute;left:0;right:0;top:calc(44% + min(72cqw,290px) / 2 + 22px);text-align:center;font-family:var(--gothic);font-size:84px;line-height:1;color:var(--ink);letter-spacing:.04em}
.s4{background:var(--ochre)}
.i4-sp{position:absolute;top:-30px;bottom:-30px;width:12px;background:var(--sprk-d) 0 0/12px 26px repeat-y}
.i4-sp.l{left:12px}.i4-sp.r{right:12px}
.i4-beam{position:absolute;left:50%;top:50%;width:300%;height:300%;transform-origin:0 0;transform:rotate(112deg);clip-path:polygon(0 0,100% 12%,100% 48%);background:linear-gradient(90deg,rgba(141,203,199,.85),rgba(141,203,199,0) 75%)}
.i4-reel-m{position:absolute;left:50%;top:44%;width:min(72cqw,290px);height:min(72cqw,290px);margin:calc(min(72cqw,290px) / -2) 0 0 calc(min(72cqw,290px) / -2)}
.i4-reel{position:relative;width:100%;height:100%;filter:var(--lift)}
.i4-reel svg{width:100%;height:100%;display:block}
.i4-title{position:absolute;left:34px;bottom:12%;font-family:var(--tall);line-height:.78;color:var(--ink);white-space:nowrap}
.i4-title i{display:inline-block;font-style:normal}
.i4-k{position:absolute;left:36px;top:calc(12px + env(safe-area-inset-top) + 40px);font-size:10px;font-weight:800;letter-spacing:.32em;text-transform:uppercase}
.s5{background:var(--teal);color:var(--paper)}
.i5-grid{position:absolute;inset:0;width:100%;height:100%}
.i5-title-w{position:absolute;left:22px;top:52%;transform:rotate(var(--ga))}
.i5-title{font-family:var(--map);font-weight:600;letter-spacing:.2em;white-space:nowrap;line-height:1}
.i5-co{position:absolute;left:24px;bottom:16%;font-family:var(--type);font-size:13px;letter-spacing:.1em}
.s6{background:var(--ink)}
.i6-tile{position:absolute;left:50%;top:44%;width:96px;height:112px;margin:-56px 0 0 -48px;background:var(--verm);display:grid;place-items:center}
.i6-tile svg{width:64%;overflow:visible}
.i6-tile .lf{fill:var(--paper);fill-rule:evenodd}
.s7{background:transparent}
.i7-h{position:absolute;left:0;right:0;background:var(--verm)}
.i7-h.t{top:0;height:62%}
.i7-h.b{bottom:0;height:47%}
.i7-word{position:absolute;left:22px;right:22px;bottom:15%}
.i7-word svg{display:block;width:100%;height:auto;overflow:visible;filter:var(--lift)}
.i7-cap{position:absolute;left:24px;top:24%;font-size:10px;font-weight:800;letter-spacing:.32em;text-transform:uppercase;color:var(--ink)}
.i7-sh{position:absolute;inset:0;background:rgba(28,12,2,.32);transform:translateY(4px)}

/* =====================================================================
   FIN
   ===================================================================== */
.fin{position:absolute;inset:0;z-index:45;background:var(--ink);color:var(--paper);display:grid;place-items:center;overflow:hidden}
.fin-in{position:relative;text-align:center;width:100%}
.fin-word{width:62%;margin:0 auto;filter:var(--lift-d)}
.fin-word svg{display:block;width:100%;height:auto;overflow:visible}
.fin .lf{fill:var(--paper)}
.fin .lb{fill:var(--verm)}
.fin-bar{width:44%;height:12px;margin:34px auto 0;background:var(--verm)}
.fin-k{margin-top:26px;font-size:10px;font-weight:800;letter-spacing:.34em;text-transform:uppercase;line-height:2}
.fin-s{margin-top:8px;font-family:var(--didone);font-style:italic;font-size:17px;opacity:.85}

/* =====================================================================
   PHONE CONTROLS (cue mark) + TOAST
   ===================================================================== */
.cue{position:absolute;top:calc(12px + env(safe-area-inset-top));right:14px;z-index:60;width:40px;height:40px;display:grid;place-items:center}
.cue i{display:block;width:26px;height:26px;border-radius:50%;background:var(--ink);box-shadow:inset 0 0 0 5px var(--ink),inset 0 0 0 7px var(--paper)}
.cue i::after{content:"";display:block;width:6px;height:6px;margin:10px;border-radius:50%;background:var(--verm)}
.is-intro .cue,.is-fin .cue{opacity:0;pointer-events:none}

/* =====================================================================

   ===================================================================== */

  }
  seek(t) { this.t = t; for (const an of this.a) an.currentTime = t; }

  closeOverlays(true); killIntro(); endIntro();
  let m;
  const dayWanted = (m = h.match(/^day=(-?\d+)/)) ? +m[1] : 0;
  if (S.day !== dayWanted || !S.info) { S.day = dayWanted; renderHome(); }
  scroller.scrollTop = 0;
  if (!h) { playIntro(); return; }
  if ((m = h.match(/^intro=(\d+)/))) { const tl = buildIntro(); tl.seek(Math.min(+m[1], tl.dur)); return; }
  if ((m = h.match(/^enter=([a-z]+)/))) { openWorld(m[1], { instant: true }); return; }
  if ((m = h.match(/^credits=([\w-]+)/))) { openCredits(m[1], { instant: true }); return; }
  if (h === 'running') { openSheet({ instant: true }); return; }
  if (h === 'fin') { showFin({ frozen: true }); return; }
}

/* =====================================================================
   BOOT
   ===================================================================== */
function boot() {
  const root = document.documentElement.style;
  root.setProperty('--fib-d', `url(${fibreURL(true)})`);
  root.setProperty('--fib-l', `url(${fibreURL(false)})`);
  root.setProperty('--grain', `url(${grainURL()})`);
  root.setProperty('--sprk', sprocketURL('#EEE2C8'));
  root.setProperty('--sprk-d', sprocketURL('#1B1713'));
  kStyle();
  $$('[data-controls]').forEach(c => c.innerHTML = controlsHTML());
  RM.addEventListener && RM.addEventListener('change', () => { S.rm = RM.matches; });
  const fonts = ['400 100px "League Gothic"', '400 100px "Six Caps"', '600 40px "Cormorant Garamond"', '800 20px Archivo', '400 16px "Courier Prime"', 'italic 500 20px "Bodoni Moda"', '800 20px "Bodoni Moda"'];
  const ready = document.fonts ? Promise.race([Promise.all(fonts.map(f => document.fonts.load(f))), new Promise(r => setTimeout(r, 2600))]) : Promise.resolve();
  ready.catch(() => {}).then(() => {
    applyHash();
    window.addEventListener('hashchange', applyHash);
    const align = () => { tick(false); setTimeout(align, 1000 - (Date.now() % 1000) + 15); };
    setTimeout(align, 1000 - (Date.now() % 1000) + 15);
    setInterval(() => { S.pres++; showPresence(true); }, 4200);
    let rz; window.addEventListener('resize', () => { clearTimeout(rz); rz = setTimeout(fitHome, 120); });
  });
}
boot();
</script>
